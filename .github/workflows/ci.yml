name: CI

on:
  push:
    branches: [main]
  pull_request:

# L'intégration Decap déclare les secrets OAuth comme requis (validés au
# build) : placeholders non vides ici ; les vraies valeurs sont définies
# dans Vercel (Environment Variables).
env:
  OAUTH_GITHUB_CLIENT_ID: ci-placeholder
  OAUTH_GITHUB_CLIENT_SECRET: ci-placeholder
  PUBLIC_DECAP_CMS_VERSION: 3.15.1

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

  build-and-audit:
    name: Build + budgets Lighthouse (>= 95)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI — budgets
        run: |
          npx lhci collect --config=./lighthouserc.cjs
          npx lhci assert --config=./lighthouserc.cjs

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
