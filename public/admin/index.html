<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Édition — Optima Mind</title>
  </head>
  <body>
    <!-- Chargement différé : la config est parsée depuis /admin/config.yml et
         base_url est injecté à l'origine courante (le backend Decap exige une
         origine absolue ; '' retombe silencieusement sur api.netlify.com),
         puis Decap CMS est chargé avec window.CMS_CONFIG déjà défini. -->
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
      window.__decapBootstrap = (async () => {
        try {
          const res = await fetch('/admin/config.yml');
          const text = await res.text();
          const config = window.jsyaml.load(text);
          if (config && config.backend) {
            config.backend.base_url = window.location.origin;
            config.backend.auth_endpoint = 'oauth';
          }
          window.CMS_CONFIG = config;
        } catch (err) {
          console.error('Impossible de charger la configuration Decap :', err);
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js';
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
